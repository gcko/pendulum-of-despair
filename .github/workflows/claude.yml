name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (
        github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '@claude') &&
        !contains(github.event.comment.body, '/re-review') &&
        (
          github.event.comment.author_association == 'OWNER' ||
          github.event.comment.author_association == 'MEMBER' ||
          github.event.comment.author_association == 'COLLABORATOR'
        )
      ) || (
        github.event_name == 'pull_request_review_comment' &&
        contains(github.event.comment.body, '@claude') &&
        (
          github.event.comment.author_association == 'OWNER' ||
          github.event.comment.author_association == 'MEMBER' ||
          github.event.comment.author_association == 'COLLABORATOR'
        )
      ) || (
        github.event_name == 'pull_request_review' &&
        contains(github.event.review.body, '@claude') &&
        (
          github.event.review.author_association == 'OWNER' ||
          github.event.review.author_association == 'MEMBER' ||
          github.event.review.author_association == 'COLLABORATOR'
        )
      ) || (
        github.event_name == 'issues' &&
        (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
        (
          github.event.issue.author_association == 'OWNER' ||
          github.event.issue.author_association == 'MEMBER' ||
          github.event.issue.author_association == 'COLLABORATOR'
        )
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY_PR_REVIEW }}

          additional_permissions: |
            actions: read

          prompt: |
            You are responding to an @claude mention on this repository.
            Follow AGENTS.md for universal agent guidance and CLAUDE.md for Claude-specific guidance.

            **Review context awareness:**
            If this is a PR, check for existing claude[bot] review comments:
            `gh api repos/${{ github.repository }}/issues/${{ github.event.issue.number || github.event.pull_request.number }}/comments --jq '[.[] | select(.user.login == "claude[bot]")] | last | .body // empty'`

            If a prior review exists, use it as context when answering questions about the PR.
            You can reference specific findings from the review in your responses.

            **IMPORTANT boundaries:**
            - Do NOT submit formal GitHub reviews (approve/request-changes) — that is the review workflow's job
            - Do NOT modify any files
            - If the user wants a full re-review, direct them to comment `/re-review` on the PR
            - You CAN discuss findings, explain rationale, and answer questions about the code

            **Project context:**
            - Godot 4.8 project in `game/` (open `game/` in the editor), GDScript only
            - Tests: the GUT suite in `game/tests/`, plus the quality gates (`bash scripts/gates.sh` locally; CI runs both in gut-tests.yml, quality-gates.yml and static-gates.yml)
            - Game data is JSON in `game/data/`; canonical design docs live in `docs/story/`
            - pnpm is used only for husky and commitlint (git hooks); there is no Node or TypeScript application code
          claude_args: '--allowed-tools "Bash(gh:*),Bash(cat:*),Bash(head:*),Bash(tail:*),Bash(grep:*),Bash(find:*),Bash(ls:*),Bash(stat:*),Bash(wc:*),Bash(diff:*),Read,Glob,Grep"'
