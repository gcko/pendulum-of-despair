name: GUT Tests

on:
  pull_request:
    # No `branches:` filter on purpose. Stacked PRs target their parent branch
    # rather than main, and a filter of [main] silently gave them no CI at all
    # -- the suite only ran once a PR was retargeted at merge time, which is far
    # too late to be a gate. Running on every PR base keeps each link in a stack
    # verified on its own.
    types: [opened, synchronize, reopened]

env:
  GODOT_VERSION: "4.7"

jobs:
  gut-tests:
    name: Run GUT Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download Godot
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          sudo mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          chmod +x /usr/local/bin/godot

      - name: Import Godot project (register GUT classes)
        run: |
          godot --headless --path game/ --import
        timeout-minutes: 2

      - name: Run GUT tests
        run: |
          set -o pipefail
          if ! godot --headless --path game/ -s addons/gut/gut_cmdln.gd -gdir=res://tests -gprefix=test_ -gsuffix=.gd -gexit 2>&1 \
               | sed 's/\x1b\[[0-9;]*m//g' | tee /tmp/gut.log; then
            echo "Godot exited non-zero during the GUT run."
            tail -40 /tmp/gut.log
            exit 1
          fi
          # ABSENCE OF THE SUMMARY IS A FAILURE. The old form reached `exit 1`
          # only when it could positively SEE a failure, and accepted the string
          # "All tests passed" appearing anywhere; a run that collected nothing
          # or died early was scored as a clean one. GUT 9.7.0 prints a "Failing
          # Tests" line only when something failed, so the Run Summary totals -
          # printed on every completed run - are the evidence the suite finished.
          if ! grep -qE "^Scripts[[:space:]]+[0-9]+" /tmp/gut.log \
             || ! grep -qE "^Tests[[:space:]]+[0-9]+" /tmp/gut.log; then
            echo "GUT Run Summary MISSING: no 'Scripts'/'Tests' totals, so the suite never"
            echo "reached the end. Absence of the summary FAILS; it does not pass."
            tail -40 /tmp/gut.log
            exit 1
          fi
          if grep -qE "^Failing Tests[[:space:]]+" /tmp/gut.log \
             && ! grep -qE "^Failing Tests[[:space:]]+0[[:space:]]*$" /tmp/gut.log; then
            echo "Tests failed!"
            grep -nE "^[[:space:]]+\[Failed\]" /tmp/gut.log | head -30 || true
            exit 1
          fi
          echo "All tests passed!"
        timeout-minutes: 5

      # A green suite says nothing about how many tests RAN: GUT 9.7.0 drops a
      # whole test file over a GDScript parse error and still reports
      # `Failing Tests 0`. The floors in gut-baseline.txt are the only thing
      # that notices, and until #430 nothing but a hand-run scripts/gates.sh
      # read them -- so a parse-skipped or deleted test file passed CI.
      - name: GUT script/test count floor (Gate L)
        run: python3 scripts/quality-gates/check_gut_baseline.py --log /tmp/gut.log
