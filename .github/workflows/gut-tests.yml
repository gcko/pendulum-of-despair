name: GUT Tests

on:
  pull_request:
    # No `branches:` filter on purpose. Stacked PRs target their parent branch
    # rather than main, and a filter of [main] silently gave them no CI at all
    # -- the suite only ran once a PR was retargeted at merge time, which is far
    # too late to be a gate. Running on every PR base keeps each link in a stack
    # verified on its own.
    types: [opened, synchronize, reopened]

env:
  # Bump all three together. GODOT_STATUS is "stable" for a release or the
  # pre-release tag ("beta1", "rc2"). godotengine/godot-builds hosts every
  # build, stable included; godotengine/godot hosts only stable ones, so a beta
  # URL there 404s. GODOT_SHA512 is the linux.x86_64.zip line of that release's
  # SHA512-SUMS.txt, pinned here rather than fetched next to the zip: a sums file
  # from the same release would be replaced along with a replaced asset.
  GODOT_VERSION: "4.8"
  GODOT_STATUS: "beta1"
  GODOT_SHA512: "aee4cbf3c5f86eee875c0f2f77cc9d816a3fbb220774e6ffc95fd5a557a6c5ec917f2b6118c0aa2008bd10f4b2a021225dc78ba7b7c54745411e0f2721f70a67"

jobs:
  gut-tests:
    name: Run GUT Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download Godot
        run: |
          GODOT_TAG="${GODOT_VERSION}-${GODOT_STATUS}"
          GODOT_PKG="Godot_v${GODOT_TAG}_linux.x86_64"
          GODOT_URL="https://github.com/godotengine/godot-builds/releases/download/${GODOT_TAG}"
          wget -q "${GODOT_URL}/${GODOT_PKG}.zip"
          # An unset pin is a failure, not a skip: do not lean on how a given
          # sha512sum treats a malformed line.
          : "${GODOT_SHA512:?GODOT_SHA512 must be set}"
          echo "${GODOT_SHA512}  ${GODOT_PKG}.zip" | sha512sum -c -
          unzip -q "${GODOT_PKG}.zip"
          sudo mv "${GODOT_PKG}" /usr/local/bin/godot
          chmod +x /usr/local/bin/godot
          godot --version

      - name: Import Godot project (register GUT classes)
        run: |
          godot --headless --path game/ --import
        timeout-minutes: 2

      # This step judges the PROCESS only: did Godot survive the run. Everything
      # read out of the log is judged by Gate L below. CI used to re-implement
      # the summary-presence check and the failing-tests verdict here in YAML
      # while .husky/pre-push re-implemented both again in bash, so a rule the
      # comments called single-implementation had five copies and a fix to the
      # summary regex had to land in three files (#430).
      - name: Run GUT tests
        run: |
          set -o pipefail
          if ! godot --headless --path game/ -s addons/gut/gut_cmdln.gd -gdir=res://tests -gprefix=test_ -gsuffix=.gd -gexit 2>&1 \
               | sed 's/\x1b\[[0-9;]*m//g' | tee /tmp/gut.log; then
            echo "Godot exited non-zero during the GUT run."
            tail -40 /tmp/gut.log
            exit 1
          fi
        timeout-minutes: 5

      # THE VERDICT. A green suite says nothing about how many tests RAN: GUT
      # 9.7.0 drops a whole test file over a GDScript parse error and still
      # reports `Failing Tests 0`, and a test that stops asserting is scored
      # risky rather than failing. This one step checks that the Run Summary is
      # present at all (absence FAILS, it does not pass), that nothing failed,
      # that every collected test passed, and that the script/test counts clear
      # the floors in gut-baseline.txt. Until #430 nothing but a hand-run
      # scripts/gates.sh read those floors, so a parse-skipped or deleted test
      # file passed CI unremarked.
      - name: GUT summary, failures and count floor (Gate L)
        run: python3 scripts/quality-gates/check_gut_baseline.py --log /tmp/gut.log
